services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inquest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_admin
    ports:
      - "127.0.0.1:${INQUEST_DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d inquest"]
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: ["sh", "-c", "alembic upgrade head && python -m inquest.investigation.checkpoints"]
    environment:
      INQUEST_MIGRATION_DATABASE_URL: postgresql+psycopg://inquest_migrator:local_migrator@db:5432/inquest
    depends_on:
      db:
        condition: service_healthy
  seed:
    build: .
    command: ["python", "-m", "inquest.synthetic.seed", "--load"]
    environment:
      INQUEST_MIGRATION_DATABASE_URL: postgresql+psycopg://inquest_migrator:local_migrator@db:5432/inquest
    depends_on:
      migrate:
        condition: service_completed_successfully
  api:
    build: .
    mem_limit: 512m
    command:
      - uvicorn
      - inquest.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=172.29.67.10
      - --no-access-log
    networks: [default, console]
    environment:
      INQUEST_DATABASE_URL: postgresql+psycopg://inquest_api:local_api@db:5432/inquest
      INQUEST_WEB_ORIGIN: ${INQUEST_WEB_ORIGIN:-http://localhost:5173}
      INQUEST_GITHUB_CLIENT_ID: ${INQUEST_GITHUB_CLIENT_ID:-}
      INQUEST_GITHUB_CLIENT_SECRET: ${INQUEST_GITHUB_CLIENT_SECRET:-}
      INQUEST_GOOGLE_CLIENT_ID: ${INQUEST_GOOGLE_CLIENT_ID:-}
      INQUEST_GOOGLE_CLIENT_SECRET: ${INQUEST_GOOGLE_CLIENT_SECRET:-}
      INQUEST_GROQ_API_KEY: ${INQUEST_GROQ_API_KEY:-}
      INQUEST_IP_HASH_SECRET: ${INQUEST_IP_HASH_SECRET:-}
      INQUEST_PROVIDER_CACHE: /app/cache/responses.sqlite
      INQUEST_TOOL_DATABASE_URL: postgresql+psycopg://inquest_tool:local_tool@db:5432/inquest
    volumes:
      - response_cache:/app/cache
    ports:
      - "127.0.0.1:${INQUEST_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 10
    depends_on:
      seed:
        condition: service_completed_successfully
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${INQUEST_WEB_PORT:-5173}:80"
    networks:
      console:
        ipv4_address: 172.29.67.10
    depends_on:
      api:
        condition: service_healthy

networks:
  console:
    ipam:
      config:
        - subnet: 172.29.67.0/24

volumes:
  postgres_data:
  response_cache:
