[project]
name = "inquest"
version = "0.1.0"
description = "Synthetic payment fraud investigation console"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.162.7,<0.163",
    "groq==1.7.0",
    "langgraph==1.2.21",
    "langgraph-checkpoint-postgres==3.2.0",
    "lightgbm>=4.7,<4.8",
    "numpy>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2,<3",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.40,<1",
]

[project.optional-dependencies]
gemini = [
    "google-genai==3.3.0",
]

[dependency-groups]
dev = [
    { include-group = "train" },
    "httpx2>=2,<3",
    "mypy>=1.15,<3",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]
train = [
    "scikit-learn>=1.7,<2",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
src = ["backend"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
mypy_path = "backend"
strict = true
files = ["backend"]

[[tool.mypy.overrides]]
module = ["lightgbm", "sklearn.*"]
ignore_missing_imports = true
