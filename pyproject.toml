[project]
name = "inquest"
version = "0.1.0"
description = "Synthetic payment fraud investigation console"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.7,<0.163",
    "pydantic-settings>=2,<3",
    "uvicorn>=0.40,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<3",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
src = ["backend"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
mypy_path = "backend"
strict = true
files = ["backend"]
